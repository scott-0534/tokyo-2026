                    {

                        category: "景點",
                        desc: "參觀招福殿龐大且療癒的招財貓海與三重塔 (參拜免費，想買招財貓請在16:00前抵達)。\n交通：青山一丁目(Z03半藏門線)搭至表參道(Z02)，轉千代田線/小田急線直通車至豪德寺站(OH10)下車步行10分鐘。",

                    {
                        id: "d6-shibuya",

                        category: "景點",
                        desc: "【方案 A 澀谷】SHIBUYA SKY 展望台、宮下公園、十字路口與百貨逛街買伴手禮。\n【方案 B 中目黑】目黑川粉紅 LED「冬之櫻」點燈、星巴克臻選®東京烘焙工坊與 AFURI 柚子鹽拉麵。\n交通：豪德寺搭小田急至下北澤，轉京王井之頭線直達澀谷站。",
                        mapsQuery: "Shibuya Crossing"
                    }
                ]
            },
            {
                day: "Day 7",
                label: "D7 11/29",
                title: "Day 7: 11/29 (日) 小江戶川越散策 (平日彈性調整)",
                subtitle: "江戶古剎喜多院、釣鯛魚神籤與藏造老街",
                spots: [
                    {
                        id: "d7-transport",
                        time: "08:30-09:30",
                        title: "新宿前往川越交通指南",
                        category: "交通",
                        desc: "推薦路線：JR 新宿站搭埼京線/湘南新宿線至【池袋站】(6分鐘)，站內轉乘【東武東上線】急行列車直達【川越站】(約30分鐘)，全程約40分鐘內抵達且班次極多！\n西武特急路線：西武新宿站搭乘小江戶號至本川越站 (約45分鐘)。",
                        mapsQuery: "Kawagoe Station"
                    },
                    {
                        id: "d7-kitain",
                        time: "09:30-11:00",
                        title: "第一站：喜多院 (Kita-in)",
                        category: "景點",
                        desc: "川越古剎，保存全日本唯一江戶城移築遺構「德川家光誕生間」與華麗天井畫，境內設有五百羅漢石雕像。",
                        mapsQuery: "Kitain"
                    },
                    {
                        id: "d7-hikawa",
                        time: "11:15-12:40",
                        title: "第二站：川越冰川神社",
                        category: "景點",
                        desc: "1500年歷史結緣神社！必體驗用小釣竿「釣鯛魚神籤」、走過木造大鳥居與繪馬隧道，並進行小川「人形流」除穢儀式。",
                        mapsQuery: "Kawagoe Hikawa Shrine"
                    },
                    {
                        id: "d7-street",
                        time: "13:00-17:00",
                        title: "第三站：菓子屋橫丁、藏造老街與大正浪漫夢通",
                        category: "美食",
                        desc: "1. 藏造老街地標「時之鐘」與星巴克川越鐘樓店。\n2. 美食：小川菊 200年鰻魚飯 (建議先領號碼牌)、翠扇亭地瓜三角飯糰、COEDO HACHI 烤地瓜布蕾、小江戶 OHANA 玉子燒。\n3. 菓子屋橫丁採買黑糖棒與懷古仙貝。",
                        mapsQuery: "Kawagoe Kurazukuri Zone"
                    }
                ]
            },
            {
                day: "Day 8",
                label: "D8 11/30",
                title: "Day 8: 11/30 (一) 新宿最後採買與順利返航",
                subtitle: "新宿藥妝補貨 ➔ 星宇 JX801 ➔ 台北溫馨的家",
                spots: [
                    {
                        id: "d8-shopping",
                        time: "09:00-10:30",
                        title: "新宿站周邊最後大採買",
                        category: "購物",
                        desc: "退房後將行李寄放飯店，於新宿南口/西口藥妝店、Bic Camera 採購伴手禮。",
                        mapsQuery: "Shinjuku Station"
                    },
                    {
                        id: "d8-to-airport",
                        time: "10:40-12:15",
                        title: "前往成田機場 T2 (利木津巴士 / N'EX)",
                        category: "交通",
                        desc: "搭乘利木津巴士或 N'EX 成田特快前往成田機場第二航廈，預計 12:15 前抵達辦理登機與退稅。",
                        mapsQuery: "Narita Airport Terminal 2"
                    },
                    {
                        id: "d8-flight",
                        time: "13:45-16:55",
                        title: "搭乘星宇航空 JX801 返回台北 (TPE)",
                        category: "交通",
                        desc: "13:45 成田機場(NRT) 起飛 ➔ 16:55 抵達桃園國際機場(TPE)，結束豐富美好的東京秋日之旅！",
                        mapsQuery: "Taiwan Taoyuan International Airport"
                    }
                ]
            }
        ];

        // State
        let currentTab = "Day 1";
        let checkedSpots = JSON.parse(localStorage.getItem('tokyo_autumn_2026_checks') || '{}');

        // Helpers
        function getCategoryBadge(cat) {
            switch(cat) {
                case '景點': return 'bg-maple-100 text-maple-800 border-maple-200';
                case '美食': return 'bg-amber-100 text-amber-900 border-amber-300';
                case '交通': return 'bg-blue-100 text-blue-800 border-blue-200';
                case '購物': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case '住宿': return 'bg-purple-100 text-purple-800 border-purple-200';
                default: return 'bg-gray-100 text-gray-800 border-gray-200';
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            tabsContainer.innerHTML = itineraryData.map(item => `
                <button onclick="switchTab('${item.day}')" 
                        class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-200 border ${
                            currentTab === item.day 
                            ? 'bg-maple-800 text-amber-100 border-maple-900 shadow-md scale-105' 
                            : 'bg-white/80 text-gray-700 border-amber-200 hover:bg-amber-100'
                        }">
                    ${item.label}
                </button>
            `).join('');
        }

        function switchTab(dayKey) {
            currentTab = dayKey;
            renderTabs();
            renderContent();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleCheck(id) {
            checkedSpots[id] = !checkedSpots[id];
            localStorage.setItem('tokyo_autumn_2026_checks', JSON.stringify(checkedSpots));
            renderContent();
        }

        function resetCheckmarks() {
            if (confirm('確定要清空所有景點的完成勾選狀態嗎？')) {
                checkedSpots = {};
                localStorage.removeItem('tokyo_autumn_2026_checks');
                renderContent();
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderContent();
                return;
            }

            const contentArea = document.getElementById('contentArea');
            let results = [];

            itineraryData.forEach(dayItem => {
                dayItem.spots.forEach(spot => {
                    if (spot.title.toLowerCase().includes(query) || 
                        spot.desc.toLowerCase().includes(query) || 
                        spot.category.toLowerCase().includes(query)) {
                        results.push({ ...spot, dayLabel: dayItem.label });
                    }
                });
            });

            if (results.length === 0) {
                contentArea.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa-solid fa-feather text-3xl mb-2 text-amber-300"></i>
                        <p class="text-xs">找不到與「${query}」相關的景點資訊</p>
                    </div>`;
                return;
            }

            contentArea.innerHTML = `
                <div class="text-xs font-semibold text-gray-500 mb-2">搜尋結果 (${results.length})：</div>
                <div class="space-y-3">
                    ${results.map(spot => renderSpotCard(spot, true)).join('')}
                </div>
            `;
        }

        function renderSpotCard(spot, showDayBadge = false) {
            const isChecked = !!checkedSpots[spot.id];
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.mapsQuery || spot.title)}`;

            return `
                <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-amber-200/70 transition relative overflow-hidden ${isChecked ? 'bg-amber-50/60' : ''}">
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${isChecked ? 'bg-gray-300' : 'bg-ginkgo-600'}"></div>
                    
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" 
                                   onchange="toggleCheck('${spot.id}')" 
                                   ${isChecked ? 'checked' : ''} 
                                   class="w-4 h-4 text-maple-800 rounded focus:ring-maple-800 border-gray-300 cursor-pointer">
                            <span class="text-xs font-bold text-ginkgo-700 font-mono">${spot.time}</span>
                            ${showDayBadge ? `<span class="text-[10px] bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded">${spot.dayLabel}</span>` : ''}
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-medium border ${getCategoryBadge(spot.category)}">
                            ${spot.category}
                        </span>
                    </div>

                    <div class="mt-2 pl-6">
                        <h3 class="font-bold text-sm text-gray-900 ${isChecked ? 'line-through-checked' : ''}">
                            ${spot.title}
                        </h3>
                        <p class="text-xs text-gray-600 mt-1 whitespace-pre-line leading-relaxed ${isChecked ? 'line-through-checked' : ''}">
                            ${spot.desc}
                        </p>

                        ${spot.notes ? `
                            <div class="mt-2 text-[11px] bg-amber-50 text-amber-900 p-2 rounded-xl border border-amber-200/80 flex items-start gap-1.5">
                                <i class="fa-solid fa-circle-info text-amber-600 mt-0.5"></i>
                                <span>${spot.notes}</span>
                            </div>
                        ` : ''}

                        <div class="mt-3 flex items-center gap-2 pt-2 border-t border-amber-100">
                            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center gap-1.5 text-[11px] text-blue-700 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg transition font-medium border border-blue-200">
                                <i class="fa-solid fa-map-pin text-blue-600"></i> Google 地圖導航
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContent() {
            const searchVal = document.getElementById('searchInput').value.trim();
            if (searchVal) {
                handleSearch();
                return;
            }

            const currentDayData = itineraryData.find(item => item.day === currentTab);
            const contentArea = document.getElementById('contentArea');

            if (!currentDayData) return;

            contentArea.innerHTML = `
                <div class="bg-gradient-to-r from-maple-900 to-maple-800 text-amber-50 p-4 rounded-2xl shadow-md mb-3 border border-maple-700">
                    <h2 class="font-serif font-bold text-base text-amber-100">${currentDayData.title}</h2>
                    <p class="text-xs text-ginkgo-100 mt-1">${currentDayData.subtitle}</p>
                </div>

                <div class="space-y-3">
                    ${currentDayData.spots.map(spot => renderSpotCard(spot)).join('')}
                </div>
            `;
        }

        window.onload = function() {
            renderTabs();
            renderContent();
        };
    </script>
</body>
</html>
